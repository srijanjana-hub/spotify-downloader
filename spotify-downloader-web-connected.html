<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Downloader</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --accent: #1db954;
      --accent-light: #1ed760;
      --border: #2a2a2a;
      --error: #e74c3c;
      --success: #1db954;
      --warning: #f39c12;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-primary: #ffffff;
        --bg-secondary: #f8f8f8;
        --bg-tertiary: #efefef;
        --text-primary: #191414;
        --text-secondary: #6a6a6a;
        --accent: #1db954;
        --accent-light: #1ed760;
        --border: #e0e0e0;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .main-content {
      display: grid;
      gap: 40px;
    }

    .input-section {
      background: var(--bg-secondary);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(29, 185, 84, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .output-section {
      background: var(--bg-secondary);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: none;
    }

    .output-section.active {
      display: block;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .status-icon {
      font-size: 24px;
    }

    .status-info h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .status-info p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .queue {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .track-item {
      background: var(--bg-tertiary);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .track-index {
      min-width: 32px;
      height: 32px;
      background: var(--accent);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .track-status {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .track-status.downloading {
      color: var(--warning);
    }

    .track-status.success {
      color: var(--success);
    }

    .track-status.error {
      color: var(--error);
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }

    .summary {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }

    .summary-item {
      text-align: center;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }

    .summary-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .message {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .message.success {
      background: rgba(29, 185, 84, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .message.info {
      background: rgba(179, 179, 179, 0.1);
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 32px; }
      .container { padding: 20px; }
      .input-section, .output-section { padding: 20px; }
      .button-group { flex-direction: column; }
      button { min-width: auto; }
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🎵</div>
      <h1>Spotify Downloader</h1>
      <p class="subtitle">Download your favorite playlists in minutes</p>
    </header>

    <div class="main-content">
      <section class="input-section">
        <div id="errorMessage" class="message"></div>
        <div id="successMessage" class="message"></div>
        <div id="infoMessage" class="message"></div>

        <form id="downloadForm">
          <div class="form-group">
            <label for="playlistUrl">Spotify Playlist URL</label>
            <input
              type="text"
              id="playlistUrl"
              placeholder="https://open.spotify.com/playlist/..."
              required
            />
          </div>

          <div class="form-group">
            <label for="downloadPath">Download Location</label>
            <input
              type="text"
              id="downloadPath"
              placeholder="/home/user/Music"
              value="/home/user/Music"
            />
          </div>

          <div class="form-group">
            <label for="spotifyToken">Spotify Access Token (Optional)</label>
            <textarea
              id="spotifyToken"
              placeholder="Leave empty for public playlists"
              rows="3"
            ></textarea>
          </div>

          <div class="button-group">
            <button type="button" class="btn-secondary" id="selectFolderBtn">
              📁 Select Folder
            </button>
            <button type="submit" class="btn-primary" id="submitBtn">
              ⬇️ Download Playlist
            </button>
          </div>
        </form>
      </section>

      <section class="output-section" id="outputSection">
        <div class="status-header">
          <div class="status-icon" id="statusIcon">⏳</div>
          <div class="status-info">
            <h3 id="statusTitle">Preparing Download</h3>
            <p id="statusDesc">Fetching playlist information...</p>
          </div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="overallProgress"></div>
        </div>

        <div class="queue" id="queue">
          <div class="empty-state">
            <div class="empty-state-icon">🔄</div>
            <p>Loading tracks...</p>
          </div>
        </div>

        <div class="summary" id="summary" style="display: none">
          <div class="summary-item">
            <div class="summary-value" id="totalCount">0</div>
            <div class="summary-label">Total Tracks</div>
          </div>
          <div class="summary-item">
            <div class="summary-value" id="successCount">0</div>
            <div class="summary-label">Downloaded</div>
          </div>
          <div class="summary-item">
            <div class="summary-value" id="failCount">0</div>
            <div class="summary-label">Failed</div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000';
    const POLL_INTERVAL = 1000; // 1 second

    const downloadForm = document.getElementById('downloadForm');
    const playlistUrlInput = document.getElementById('playlistUrl');
    const downloadPathInput = document.getElementById('downloadPath');
    const spotifyTokenInput = document.getElementById('spotifyToken');
    const selectFolderBtn = document.getElementById('selectFolderBtn');
    const submitBtn = document.getElementById('submitBtn');
    const outputSection = document.getElementById('outputSection');
    const queue = document.getElementById('queue');
    const errorMsg = document.getElementById('errorMessage');
    const successMsg = document.getElementById('successMessage');
    const infoMsg = document.getElementById('infoMessage');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const overallProgress = document.getElementById('overallProgress');
    const summary = document.getElementById('summary');

    let selectedPath = '/home/user/Music';
    let isDownloading = false;
    let currentJobId = null;

    function showMessage(element, message, type) {
      element.textContent = message;
      element.className = `message ${type} show`;
      setTimeout(() => {
        element.classList.remove('show');
      }, 5000);
    }

    selectFolderBtn.addEventListener('click', () => {
      const path = prompt('Enter download path:', selectedPath);
      if (path !== null) {
        selectedPath = path || '/home/user/Music';
        downloadPathInput.value = selectedPath;
      }
    });

    function isValidSpotifyUrl(url) {
      return /open\.spotify\.com\/playlist\//.test(url) || /spotify:playlist:/.test(url);
    }

    async function pollDownloadStatus(jobId) {
      try {
        const response = await fetch(`${API_BASE}/api/download/${jobId}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to get download status');
        }

        // Update UI based on download status
        updateUI(data);

        // Continue polling if not done
        if (data.status === 'downloading' || data.status === 'fetching') {
          setTimeout(() => pollDownloadStatus(jobId), POLL_INTERVAL);
        } else if (data.status === 'completed') {
          statusIcon.textContent = '✓';
          statusTitle.textContent = 'Download Complete';
          statusDesc.textContent = `Downloaded ${data.downloaded} of ${data.total} tracks to ${selectedPath}`;
          isDownloading = false;
          submitBtn.disabled = false;
          showMessage(successMsg, '✓ Download completed successfully!', 'success');
        } else if (data.status === 'failed') {
          statusIcon.textContent = '❌';
          statusTitle.textContent = 'Download Failed';
          statusDesc.textContent = data.error || 'An error occurred during download';
          isDownloading = false;
          submitBtn.disabled = false;
          showMessage(errorMsg, `❌ Download failed: ${data.error}`, 'error');
        }
      } catch (error) {
        console.error('Poll error:', error);
        showMessage(errorMsg, `❌ Connection error: ${error.message}`, 'error');
        isDownloading = false;
        submitBtn.disabled = false;
      }
    }

    function updateUI(download) {
      // Update overall progress
      overallProgress.style.width = download.progress + '%';

      // Update status description
      if (download.status === 'fetching') {
        statusDesc.textContent = 'Fetching playlist information...';
      } else if (download.status === 'downloading') {
        statusDesc.textContent = `Downloaded ${download.downloaded} of ${download.total} tracks...`;
      }

      // Update queue
      if (download.tracks && download.tracks.length > 0) {
        queue.innerHTML = '';
        download.tracks.forEach(track => {
          const trackEl = document.createElement('div');
          trackEl.className = 'track-item';

          let statusHtml = '';
          if (track.status === 'downloading') {
            statusHtml = `<span class="spinner"></span> Downloading (${track.progress}%)`;
          } else if (track.status === 'completed') {
            statusHtml = '✓ Downloaded';
          } else if (track.status === 'failed') {
            statusHtml = `❌ Failed: ${track.error || 'Unknown error'}`;
          } else {
            statusHtml = 'Pending...';
          }

          trackEl.innerHTML = `
            <div class="track-index">${track.index}</div>
            <div class="track-info">
              <div class="track-name">${track.name} - ${track.artist}</div>
              <div class="track-status ${track.status}">
                ${statusHtml}
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${track.progress}%"></div>
              </div>
            </div>
          `;
          queue.appendChild(trackEl);
        });
      }

      // Update summary if complete
      if (download.status === 'completed') {
        summary.style.display = 'grid';
        document.getElementById('totalCount').textContent = download.total;
        document.getElementById('successCount').textContent = download.downloaded;
        document.getElementById('failCount').textContent = download.failed;
      }
    }

    downloadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
      infoMsg.classList.remove('show');

      if (!playlistUrlInput.value.trim()) {
        showMessage(errorMsg, '❌ Please enter a Spotify playlist URL', 'error');
        return;
      }

      if (!isValidSpotifyUrl(playlistUrlInput.value)) {
        showMessage(
          errorMsg,
          '❌ Invalid Spotify URL. Please use: https://open.spotify.com/playlist/...',
          'error'
        );
        return;
      }

      if (!selectedPath && !downloadPathInput.value) {
        showMessage(errorMsg, '❌ Please select a download location', 'error');
        return;
      }

      // Start download
      isDownloading = true;
      submitBtn.disabled = true;
      outputSection.classList.add('active');
      overallProgress.style.width = '0%';
      summary.style.display = 'none';

      statusIcon.textContent = '⏳';
      statusTitle.textContent = 'Starting Download';
      statusDesc.textContent = 'Connecting to server...';

      showMessage(
        infoMsg,
        '🚀 Starting download... This may take a few minutes depending on playlist size.',
        'info'
      );

      try {
        const response = await fetch(`${API_BASE}/api/download`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            playlistUrl: playlistUrlInput.value,
            downloadPath: selectedPath || downloadPathInput.value,
            spotifyToken: spotifyTokenInput.value || null
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to start download');
        }

        currentJobId = data.jobId;
        statusIcon.textContent = '⏳';
        statusTitle.textContent = 'Downloading Playlist';

        // Start polling for status
        pollDownloadStatus(currentJobId);
      } catch (error) {
        console.error('Download error:', error);
        showMessage(errorMsg, `❌ ${error.message}`, 'error');
        isDownloading = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
