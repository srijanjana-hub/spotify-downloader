<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 2;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }

        .selected-folder {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }

        .queue-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .queue-section h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .queue-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .queue-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }

        .queue-item-title {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .queue-item-status {
            font-size: 12px;
            color: #999;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-primary {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Spotify Downloader</h1>
            <p>Download entire playlists locally</p>
        </div>

        <div id="statusMessage" class="status-message hidden"></div>

        <div class="form-group">
            <label for="playlistUrl">Spotify Playlist URL</label>
            <input
                type="text"
                id="playlistUrl"
                placeholder="https://open.spotify.com/playlist/..."
                aria-label="Spotify playlist URL"
            >
        </div>

        <div class="form-group">
            <label for="spotifyToken">Spotify API Token (Optional)</label>
            <input
                type="password"
                id="spotifyToken"
                placeholder="Your Spotify API token"
                aria-label="Spotify API token for authentication"
            >
        </div>

        <div class="form-group">
            <label>Download Folder</label>
            <div class="button-group">
                <button class="btn-secondary" id="selectFolderBtn" aria-label="Select download folder">
                    📁 Select Folder
                </button>
            </div>
            <div id="selectedFolder" class="selected-folder hidden">
                No folder selected
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="downloadBtn" aria-label="Start downloading playlist">
                ⬇️ Download Playlist
            </button>
        </div>

        <div class="queue-section hidden" id="queueSection">
            <h2>📊 Download Queue</h2>
            <div class="queue-list" id="queueList"></div>
        </div>
    </div>

    <script>
        let selectedDownloadPath = null;
        let downloadQueue = [];
        let isDownloading = false;

        const playlistUrlInput = document.getElementById('playlistUrl');
        const spotifyTokenInput = document.getElementById('spotifyToken');
        const selectFolderBtn = document.getElementById('selectFolderBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const selectedFolderDiv = document.getElementById('selectedFolder');
        const statusMessageDiv = document.getElementById('statusMessage');
        const queueSection = document.getElementById('queueSection');
        const queueList = document.getElementById('queueList');

        // Select folder
        selectFolderBtn.addEventListener('click', async () => {
            try {
                const folderPath = await window.electronAPI.selectFolder();
                if (folderPath) {
                    selectedDownloadPath = folderPath;
                    selectedFolderDiv.textContent = folderPath;
                    selectedFolderDiv.classList.remove('hidden');
                    showStatus(`Folder selected: ${folderPath}`, 'info');
                }
            } catch (error) {
                showStatus(`Error selecting folder: ${error.message}`, 'error');
                console.error('Folder selection error:', error);
            }
        });

        // Download playlist
        downloadBtn.addEventListener('click', async () => {
            if (!playlistUrlInput.value.trim()) {
                showStatus('Please enter a Spotify playlist URL', 'error');
                return;
            }

            if (!selectedDownloadPath) {
                showStatus('Please select a download folder', 'error');
                return;
            }

            if (isDownloading) {
                showStatus('Download already in progress', 'info');
                return;
            }

            isDownloading = true;
            downloadBtn.disabled = true;
            selectFolderBtn.disabled = true;
            playlistUrlInput.disabled = true;

            try {
                const response = await window.electronAPI.downloadPlaylist({
                    playlistUrl: playlistUrlInput.value.trim(),
                    downloadPath: selectedDownloadPath,
                    spotifyToken: spotifyTokenInput.value.trim() || null
                });

                downloadQueue = response.queue || [];
                showQueueUI();
                showStatus('Download started successfully', 'success');

                // Listen for progress updates
                window.electronAPI.onProgressUpdate((data) => {
                    updateQueueItem(data);
                });
            } catch (error) {
                showStatus(`Download failed: ${error.message}`, 'error');
                console.error('Download error:', error);
            } finally {
                isDownloading = false;
                downloadBtn.disabled = false;
                selectFolderBtn.disabled = false;
                playlistUrlInput.disabled = false;
            }
        });

        function showStatus(message, type) {
            statusMessageDiv.textContent = message;
            statusMessageDiv.className = `status-message ${type}`;
            statusMessageDiv.classList.remove('hidden');

            if (type !== 'error') {
                setTimeout(() => {
                    statusMessageDiv.classList.add('hidden');
                }, 5000);
            }
        }

        function showQueueUI() {
            queueSection.classList.remove('hidden');
            renderQueue();
        }

        function renderQueue() {
            queueList.innerHTML = '';
            downloadQueue.forEach((item) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'queue-item';
                itemEl.innerHTML = `
                    <div class="queue-item-title">${escapeHtml(item.title || 'Unknown Track')}</div>
                    <div class="queue-item-status">${item.status || 'Pending'}</div>
                    ${item.progress !== undefined ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${item.progress}%"></div>
                        </div>
                    ` : ''}
                `;
                queueList.appendChild(itemEl);
            });
        }

        function updateQueueItem(data) {
            const item = downloadQueue.find(q => q.id === data.id);
            if (item) {
                item.status = data.status;
                item.progress = data.progress;
                renderQueue();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
